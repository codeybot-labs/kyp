[package]
name = "kyp-integration-tests"
version = "0.1.0"
edition = "2021"
publish = false

# Separate workspace: near-workspaces needs a newer toolchain than the contracts.
[workspace]

[dev-dependencies]
near-workspaces = { version = "0.24", features = ["unstable"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
